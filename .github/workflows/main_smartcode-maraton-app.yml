# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# Monorepo: build web/ with Node 20, copy web/dist into api/app/static, deploy only api/.

name: Build and deploy Python app to Azure Web App - smartcode-maraton-app

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Copy web build into API static folder
        run: |
          rm -rf api/app/static
          cp -r web/dist api/app/static

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        working-directory: api
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          python -m pytest -q

      # SCM_DO_BUILD_DURING_DEPLOYMENT=1: Oryx installs api/requirements.txt on Azure, so antenv is excluded.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            api/
            !api/antenv/
            !api/.venv/
            !api/tests/
            !api/local.db

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'smartcode-maraton-app'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_97191C44BD9A4362978FCD06983E784B }}
